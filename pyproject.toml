[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GoniOwl"
description = "CNN sample-pin detection for collision prevention on beamline I23 (PyTorch)"
readme = "README.md"
authors = [{ name = "James O'Hea", email = "James.OHea@diamond.ac.uk" }]
license = { text = "Apache License 2.0" }
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "torch==2.14.1",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "opencv-python==5.0.0.93",
    "h5py==3.16.0",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "tqdm==4.70.1",
    "tensorboard==2.21.0",
    "optuna==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
GoniOwl = "GoniOwl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["GoniOwl*"]

[tool.setuptools.package-data]
GoniOwl = ["*.pt"]

[tool.setuptools_scm]
write_to = "src/GoniOwl/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=native"
markers = ["slow: trains models (deselect with -m 'not slow')"]
